name: CI - quality and containers

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Java - tests, coverage and SpotBugs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todo_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/todo_db
      DB_USER: todo_user
      DB_PASSWORD: todo_ci_only
      JWT_SECRET: test-only-long-nonproduction-secret-please-do-not-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # ddl-auto=validate: the schema must exist before the Spring context starts.
      - name: Apply database scripts
        working-directory: .
        env:
          PGPASSWORD: todo_ci_only
        run: |
          for f in database/*.sql; do
            echo "Applying $f"
            psql -h localhost -U todo_user -d todo_db -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Build, test and verify
        run: mvn -B -ntp clean verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  frontend-quality:
    name: React - lint, tests, coverage and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
